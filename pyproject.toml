[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-journal"
version = "1.0.0"
description = "A small local-first journal: create, edit, tag, link, search, archive, export."
requires-python = ">=3.11"
dependencies = []
license = {text = "AGPL-3.0-only OR LicenseRef-Commercial"}
authors = [{name = "Samuel Jackson Grim", email = "samgrim97@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
resonance = "resonance.cli:main"

[tool.setuptools]
packages = ["resonance"]
